join_request:
  text: |
    Подтверди вступление в канал Импрув и забирай бесплатный видеоурок по заработку на банках

    Чтобы вступить в канал и получить видеоурок, нажимай на ссылку ниже 👇
  image: assets/join_request.jpg

start:
  text: |
    Бесплатный видеоурок по заработку на банках

    ✋ Привет, это Гоша Ромашин

    В этом уроке я простым языком объяснил, как работает банковский арбитраж и дал основное понимание схемы

    Он будет особенно актуален тем, кто хочет повысить свой доход и начать зарабатывать от 150.000 ₽/мес полностью удалённо

    🎁 Смотри до конца, ведь я оставил внутри видео подарок, который поможет тебе начать зарабатывать прямо сейчас

    СМОТРИ👇🏻
  video_button: "СМОТРЕТЬ ВИДЕОУРОК"
  image: assets/start.jpg

video_link:
  text: |
    🎬 Отлично, отправляю приватную ссылку на закрытый видеоурок:
 

consultation:
  text: |
    Бесплатная консультация от Гоши Ромашина. Расскажу конкретно что делать

    👐 Открываю набор прямо сейчас и дарю тебе одно бесплатное место

    На консультации:

    — составлю тебе понятный план действий на ближайшие месяцы с ориентиром на выход в 150.000 ₽/мес

    — расскажу как не поймать срезы и уверенно дойти до выплат

    — вместе подберём для тебя актуальную связку для уверенного старта в арбитраже

    — дам информацию, как масштабироваться до дохода >300.000 ₽/мес

    Нажимай на кнопку и бронируй место на консультацию 👇🏻
  button: "ЗАПИСАТЬСЯ НА БЕСПЛАТНУЮ КОНСУЛЬТАЦИЮ"
  image: assets/consultation.jpg
  delay_minutes: 1
  link_text: |
    Спасибо за ответы! Вот ссылка для записи на бесплатную консультацию 👇
  

survey:
  who:
    question: "Кто ты?"
    options:
      - "Новичок"
      - "+- Шарю"
      - "Специалист"
  income:
    question: "Сколько зарабатываешь?"
    options:
      - "0 ₽"
      - "До 50к ₽"
      - "50к ₽ — 100к ₽"
      - "100к ₽ — 250к ₽"
      - "250к ₽ — 500к ₽"
      - "500к ₽ +"
  age:
    question: "Сколько тебе лет?"
    options:
      - "14-17"
      - "18-25"
      - "26+"
  request:
    question: "Напиши текстом, какой у тебя запрос на консультацию"
  admin_template: |
    📋 Новая заявка на консультацию

    👤 ID: {telegram_id}
    👤 Username: @{username}
    👤 Имя: {first_name}

    1️⃣ Кто ты: {survey_who}
    2️⃣ Доход: {survey_income}
    3️⃣ Возраст: {survey_age}
    4️⃣ Запрос: {survey_request}

reminders:
